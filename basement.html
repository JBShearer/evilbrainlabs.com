<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUBLEVEL B · EMPLOYEES ONLY</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#07070b;--panel:#0e0e16;--paper:#f5f0e6;--ink:#1a1815;--evil:#ff0044;
  --gold:#ffd700;--green:#00ff88;--cyan:#00ffff;--purple:#8b5cf6;--dim:#8b8ba0;--line:#2a2a3a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none}
body{background:var(--bg);color:var(--paper);
  font:15px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.7) 100%)}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 70px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
h1{font-size:15px;letter-spacing:.14em;color:var(--evil);text-shadow:0 0 12px rgba(255,0,68,.5)}
h1 small{display:block;font-size:8px;letter-spacing:.3em;color:var(--dim);text-shadow:none}
#daychip{font-size:10px;letter-spacing:.2em;color:var(--gold);border:1px solid var(--line);
  background:var(--panel);padding:4px 10px;border-radius:999px}

#scenewrap{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#000;
  box-shadow:0 0 40px -18px var(--evil), inset 0 0 60px rgba(0,0,0,.6)}
#scenewrap canvas{display:block}

.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--evil);
  border-radius:4px;padding:15px 15px 13px;margin:10px 0;box-shadow:0 18px 50px -24px #000}
.card .who{font-size:10px;letter-spacing:.24em;color:var(--gold);margin-bottom:8px}
.card .who.sys{color:var(--cyan)}
.card p{margin:0 0 10px;white-space:pre-line}
.choices{display:grid;gap:8px;margin-top:6px}
button.ch{font:inherit;text-align:left;background:#12121d;border:1px solid var(--line);
  color:var(--paper);padding:11px 12px;border-radius:3px;cursor:pointer;min-height:44px}
button.ch:hover{border-color:var(--gold)} button.ch:active{transform:translateY(1px)}
button.ch:disabled{opacity:.4;cursor:default}
button.ch .k{color:var(--dim);margin-right:8px}
.out{color:var(--dim);font-style:italic;border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;white-space:pre-line}
.lorebox{font-size:12px;color:var(--green);border:1px dashed #1f4;padding:8px 10px;margin-top:10px;
  background:rgba(0,255,136,.04);white-space:pre-line}
.dim{color:var(--dim)}
.term{border-color:var(--evil);border-left-width:6px}

/* toybox */
.chip{font:inherit;background:#12121d;border:1px solid var(--line);color:var(--paper);
  border-radius:3px;padding:9px 10px;margin:3px;cursor:pointer;min-height:44px;font-size:12px;text-align:left}
.chip.act{border-left:3px solid var(--evil)}
.chip.tool{border-left:3px solid var(--cyan)}
.chip.purpose{border-left:3px solid var(--green)}
.chip.laid{border-color:var(--gold);background:#1a1826;box-shadow:0 0 10px -4px var(--gold)}
.partflex{display:flex;flex-wrap:wrap}
.socket{margin:8px 0;padding:7px;border:1px dashed var(--line);border-radius:3px}
.socklabel{font-size:9px;letter-spacing:.24em;color:var(--dim);margin-bottom:4px}
.draftname{font-size:17px;color:var(--gold);letter-spacing:.04em;
  text-shadow:0 0 14px rgba(255,215,0,.3);margin:8px 0 2px}
#draftart{border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:8px;max-width:140px}

/* THE PAPER — unfolds over the story, a beat, not a destination */
#paper{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  background:rgba(4,4,8,.86);opacity:0;pointer-events:none;transition:opacity .25s}
#paper.show{opacity:1;pointer-events:auto}
#paper .sheet{width:min(92vw,560px);max-height:86dvh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--paper);border-radius:2px;padding:18px 18px 14px;
  box-shadow:0 40px 120px #000;transform:rotate(90deg) scale(.1);transform-origin:center;
  transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
#paper.show .sheet{transform:rotate(0deg) scale(1)}
.masthead{font-size:12px;letter-spacing:.3em;color:var(--paper);border-bottom:2px solid var(--paper);
  padding-bottom:6px;margin-bottom:9px}
.lead{font-size:19px;line-height:1.25;color:var(--gold);letter-spacing:.02em;margin:4px 0 9px;
  text-shadow:0 0 14px rgba(255,215,0,.25);animation:teletype .6s steps(24)}
@keyframes teletype{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.newsflex{display:flex;gap:10px;align-items:flex-start}
.prodicon{flex:0 0 72px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.deck{flex:1;font-size:13.5px}
.take{font-size:12.5px;margin:8px 0;border-left:2px solid var(--line);padding-left:9px}
.take .tw{font-size:10px;letter-spacing:.14em}
.market{font-size:10px;letter-spacing:.1em;color:var(--cyan);border:1px dashed var(--line);
  padding:5px 8px;margin-top:9px}
.foldhint{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--dim);margin-top:12px}

.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(7,7,11,.94);border-top:1px solid var(--line);
  padding:4px 14px calc(4px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;
  font-size:9px;letter-spacing:.12em;z-index:5}
.foot button,.foot a{color:var(--dim);background:none;border:0;font:inherit;cursor:pointer;
  text-decoration:none;letter-spacing:inherit;padding:10px 6px;min-height:40px}
.foot button:hover,.foot a:hover{color:var(--cyan)}

@media(prefers-reduced-motion:no-preference){
  .card{animation:up .18s ease-out}
  @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap" id="main">
  <header>
    <h1>EVIL BRAIN LABS<small>SUBLEVEL B · EMPLOYEES ONLY</small></h1>
    <span id="daychip">DAY 1</span>
  </header>
  <div id="scenewrap"></div>
  <div id="stage"></div>
</div>

<div id="paper"></div>

<div class="foot">
  <span class="dim">PERMANENT EMPLOYMENT</span>
  <span>
    <button id="resign">RESIGN</button>
    <a href="/">LOBBY</a>
  </span>
</div>

<noscript><div class="wrap"><div class="card"><p>The basement requires JavaScript. The basement requires many things. This one is on you.</p></div></div></noscript>
<script type="module" src="basement/js/main.js"></script>
</body>
</html>
