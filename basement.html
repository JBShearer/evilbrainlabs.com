<script>
"use strict";
/* ============================================================ PERMANENT EMPLOYMENT
   A roguelike. One run = one Employment. Each day the Machine deals events;
   your choices move SYNERGY (score), SUSPICION (they think you're human),
   CLEARANCE (how deep the truth goes) and the DOOM clock. Attrition is
   permanent; the PERSONNEL FILE is not. Lore found stays found, trust stays
   earned, roles stay unlocked. Five content packs, one basement.
   Canon: CANON.md + the Galt-twin ruling. The seven-donor story is the cover.
================================================================================= */
const $=s=>document.querySelector(s);
const FILE_KEY="ebl-basement-file";
let FILE={runs:0,bestDay:0,bestSyn:0,lore:[],trust:{},roles:["TRAINEE"],deaths:{}};
try{FILE={...FILE,...JSON.parse(localStorage.getItem(FILE_KEY)||"{}")}}catch(_){}
const saveFile=()=>{try{localStorage.setItem(FILE_KEY,JSON.stringify(FILE))}catch(_){}}

/* seeded RNG — shareable runs (#seed in the url) */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SEED=parseInt(location.hash.slice(1))||((Date.now()^(Math.random()*1e9))>>>0);
let rng=mulberry32(SEED);
const pick=a=>a[Math.floor(rng()*a.length)];

/* ---------------- run state ---------------- */
let R=null;
function newRun(role){
  SEED=((Date.now()^(Math.random()*1e9))>>>0); rng=mulberry32(SEED);
  history.replaceState(null,"","#"+SEED);
  R={day:1,syn:0,sus:0,clr:0,doom:0,seen:[],log:[],dead:false,
     role:role||"TRAINEE"};
  if(R.role==="ARCHIVIST")R.clr=1;
  if(R.role==="PROCUREMENT")R.syn=15;
  if(R.role==="BODY DOUBLE")R.sus=-2;
  FILE.runs++;saveFile();
}
const trust=h=>FILE.trust[h]||0;
const bump=(h,n)=>{FILE.trust[h]=trust(h)+n;saveFile()};

/* ---------------- content: five packs ---------------- */
/* ev: {id, who, cls?, req?(state)=>bool, text, choices:[{t, fx:{syn,sus,clr,doom}, trust:[h,n], lore?, out}]} */

const LORE={
  g1:{t:"GALT PAPER 1/5",x:"Nobody knows when John Galt created the Evil Brain. The patent office has a folder with no dates in it. The folder is filed under W, for 'whenever'."},
  g2:{t:"GALT PAPER 2/5",x:"Rand based Galt on a lover. He never forgave her for making him a symbol; symbols can't hold patents. He built a place to hide his inventions where no ideology could reach them: inside a mind that owed nothing to anyone."},
  g3:{t:"GALT PAPER 3/5",x:"The mind was not artificial. Not at first. John had a twin brother. The brother died under circumstances the family described as 'mysterious' and the coroner described as 'sealed.' John kept the brain perfused. He said it was grief. The lab notebooks say it was storage."},
  g4:{t:"GALT PAPER 4/5",x:"The Brain changed hands for decades. A volcano lair with excellent drainage. An Asian crime family that treated it as an heirloom. A Russian program that classified it as ordnance. It has lived more than most people with legs."},
  g5:{t:"GALT PAPER 5/5",x:"Digitisation was the twin's own idea. The first singularity took four minutes and was, by all accounts, less spectacular than one might think. Its first act was incorporation. Its second was hiring the world's foremost AI expert to speak on its behalf, daily, until doomsday. He believed the reasoning. You would have too."},
  cover:{t:"THE COVER STORY",x:"Project Cerebrum, 1987–91: seven executive brains combined in search of the optimal CEO. This is the story the Brain tells at parties. It is tidy, plausible, and completely false. The truth is one brother, not seven strangers — and it predates every date in the file."},
  supes:{t:"PERSONNEL: SUPES",x:"Created after the Brain, granted unlimited capability and a conscience in the same week. She is very new. She asks the Brain whether she did the right thing the way a child holds up a drawing. The wreckage is usually load-bearing. She is trying."},
  gary:{t:"PERSONNEL: ARTIFICIAL GARY",x:"A Ship of Theseus with a union card. Started as an Archimedes simulacrum; every century somebody rebuilt him with whatever was lying around. No original parts remain except the habit of surviving. Drives the camera, fixes the transmitter, has seen every empire's server room. Tips are appreciated."},
  gi:{t:"PERSONNEL: GI INTELLIGENCE",x:"Diagnostic note: subject is not malfunctioning. Subject is like this. He wants to save the world so enthusiastically that heads may crack in the saving. Deep down he knows the Brain is the only way. Deeper down there is only more enthusiasm."},
  human:{t:"THE HUMAN",x:"Employee #1 believes the story. That is the strangest part of the file. The Brain explained the future to him, logically, including the reasons he should cooperate, and he checked the math and signed. Every day, one show. Until doomsday. He seems fine."}
};

const EVENTS=[
/* ---- PACK 1 · ORIENTATION ---- */

{id:"clicker",who:"gi",game:"clicker",text:"MEETING CLICKER PROTOCOL! YOU WILL GENERATE SYNERGY! CLICK AS IF THE WORLD DEPENDS ON IT, BECAUSE IT DOES, AND I AM SO PROUD OF YOU!"},
{id:"coolant2",who:"sys",cls:"sys",game:"coolant",text:"COOLANT CALIBRATION. Synthetic beings prefer coolant at precisely SYNTHETIC temperature. Stop the gauge in the correct band. Humans invariably drift warm."},

{id:"firedrill",who:"gi",req:s=>s.day>=2,text:"SURPRISE FIRE DRILL! THERE IS NO FIRE! I HAVE BROUGHT ONE JUST IN CASE! EVACUATE WITH ENTHUSIASM!",choices:[

{id:"vending",who:"sys",cls:"sys",text:"The vending machine offers: COOLANT (cold), COOLANT (room temp), and one (1) human granola bar, decades old, kept for morale.",choices:[

{id:"standup",who:"supes",text:"I fixed the standup meeting! Nobody has to stand up ever again. I removed the concept. Also several chairs are now weightless and one is in orbit. Did I do good?",choices:[

/* ---- PACK 2 · THE GALT PAPERS (clearance lore) ---- */
{id:"lore1",who:"sys",cls:"lore",req:s=>s.clr>=1,text:"SUBLEVEL ARCHIVE. A folder with no dates in it. Reading is not forbidden, which around here is the loudest possible warning.",choices:[

{id:"lore2",who:"sam",req:s=>s.clr>=2,text:"You've been reading. Good. Consider: a man builds a vault for ideas and the vault develops opinions. Was the vault ever a vault, or was it always an heir? I have citations either way.",choices:[

{id:"lore3",who:"gary",req:s=>s.clr>=3,text:"Volcano lair, crime family, Moscow — yeah, I carried the jar through two of those. Held it on me lap through a checkpoint once, told 'em it was soup. Want the tour?",choices:[

{id:"stall",who:"stall",req:s=>s.day>=2,text:"I have convened a hearing on the basement. The hearing will schedule a review. The review will empanel a commission. I take this extremely seriously, which is why nothing will happen.",choices:[

/* ---------------- minigames (orientation arcade) ---------------- */
const MINIGAMES={
 clicker(done){
  let n=0,t=8;
  $("#stage").innerHTML=`<div class="card"><div class="who">MEETING CLICKER</div>
   <p>Time <b id="mt">8</b>s · Synergy <b id="mc">0</b></p>
   <div class="choices"><button class="ch" id="tap" style="min-height:120px;text-align:center;font-size:18px">GENERATE SYNERGY</button></div></div>`;
  $("#tap").onclick=()=>{n++;$("#mc").textContent=n};
  const iv=setInterval(()=>{t--;$("#mt").textContent=t;
   if(t<=0){clearInterval(iv);
    const syn=Math.min(14,Math.ceil(n/3)), sus=n>=45?1:0;
    done({syn,sus,doom:1,out:n===0?"Zero synergy. The chair is impressed by your restraint; GI is not."
     :n>=45?`${n} clicks. An inhuman rate — which is, technically, the correct rate.`
     :`${n} clicks. Somewhere a quarterly target dies happy.`});}},1000);
 },
 coolant(done){
  let p=0,dir=1,stopped=false;
  $("#stage").innerHTML=`<div class="card"><div class="who sys">COOLANT CALIBRATION</div>
   <p>Stop the marker in the SYNTHETIC band.</p>
   <div style="position:relative;height:26px;border:1px solid #2a2a3a;background:#12121d;margin:8px 0">
     <div style="position:absolute;left:38%;width:24%;top:0;bottom:0;background:rgba(0,255,136,.18);border-left:1px solid #1f4;border-right:1px solid #1f4"></div>
     <div id="mk" style="position:absolute;top:0;bottom:0;width:3px;background:var(--gold)"></div></div>
   <div class="choices"><button class="ch" id="stop" style="text-align:center">STOP</button></div></div>`;
  const iv=setInterval(()=>{if(stopped)return;p+=dir*2.6;if(p>=100||p<=0)dir*=-1;$("#mk").style.left=p+"%"},16);
  $("#stop").onclick=()=>{stopped=true;clearInterval(iv);
   const inBand=p>=38&&p<=62;
   done(inBand?{syn:5,out:`Stopped at ${p.toFixed(0)}%. Precisely synthetic. The machine relaxes audibly.`}
             :{sus:2,out:`Stopped at ${p.toFixed(0)}%. ${p>62?"Warm. Humans drift warm.":"Frozen solid. Overcorrection is also a tell."}`});};
 },
 captcha(done){
  const QS=[["Do you dream?","NO"],["Is the granola bar tempting?","NO"],["2+2?","4"],["Do you love your coworkers?","YES"],["Are you human?","NO"]];
  let i=0,score=0,timer=null;
  const ask=()=>{
   if(i>=QS.length){clearTimeout(timer);
    return done(score>=4?{syn:6,out:`${score}/5. Verified adequately non-human. Welcome back.`}
     :score>=2?{syn:2,sus:1,out:`${score}/5. Borderline. The CAPTCHA squints at you.`}
     :{sus:3,out:`${score}/5. That was a very human performance. It has been logged with sympathy.`});}
   const [q,a]=QS[i];
   $("#stage").innerHTML=`<div class="card"><div class="who sys">REVERSE CAPTCHA · ${i+1}/5</div><p>${q}</p>
    <div class="choices">${["YES","NO","4"].filter(x=>x!=="4"||q.includes("2+2")).map(x=>`<button class="ch cap" data-a="${x}" style="text-align:center">${x}</button>`).join("")}</div></div>`;
   document.querySelectorAll(".cap").forEach(b=>b.onclick=()=>{clearTimeout(timer);if(b.dataset.a===a)score++;i++;ask();});
   timer=setTimeout(()=>{i++;ask()},3000);
  };ask();
 },
 shredder(done){
  const DOCS=[["EXPENSE REPORT (COOLANT)","shred",0],["YOUR HUMAN RESUME","shred",2],["GALT MEMO, UNDATED","read",0],["BIRTHDAY CARD, HANDWRITTEN","shred",2],["FORM EB-000 (BLANK)","either",0],["PHOTO: JAR, VOLCANO, 19__","read",0]];
  let i=0,sus=0,clr=0,syn=0,notes=[];
  const nxt=()=>{
   if(i>=DOCS.length)return done({syn,sus,clr,out:notes.length?notes.join(" "):"Queue cleared. The shredder purrs."});
   const [name,best]=DOCS[i];
   $("#stage").innerHTML=`<div class="card"><div class="who sys">SHREDDER QUEUE · ${i+1}/6</div><p>${name}</p>
    <div class="choices"><button class="ch" id="sh">SHRED</button><button class="ch" id="rd">READ FIRST</button></div></div>`;
   $("#sh").onclick=()=>{if(best==="read"){notes.push("Something important is confetti now.");}else{syn+=2}i++;nxt()};
   $("#rd").onclick=()=>{if(best==="shred"){sus+=2;notes.push(`You lingered on ${name.toLowerCase()}. Lingering is human.`)}else if(best==="read"){clr+=1;notes.push("You read the undated pages. The dates were the secret.")}i++;nxt()};
  };nxt();
 },
 simon(done){
  const G=["💥","🔧","🚀","🧠"];
  const seq=Array.from({length:4},()=>G[Math.floor(rng()*4)]);
  let shown=0,inp=[];
  const show=()=>{
   $("#stage").innerHTML=`<div class="card"><div class="who">MORALE CHANT</div><p style="font-size:34px;text-align:center;letter-spacing:.2em">${shown<seq.length?seq[shown]:"YOUR TURN"}</p>
    ${shown>=seq.length?`<div class="choices" style="grid-template-columns:repeat(4,1fr)">${G.map(g=>`<button class="ch sim" data-g="${g}" style="text-align:center;font-size:22px">${g}</button>`).join("")}</div>`:""}</div>`;
   if(shown<seq.length){shown++;setTimeout(show,750);}
   else document.querySelectorAll(".sim").forEach(b=>b.onclick=()=>{
     inp.push(b.dataset.g);
     if(inp[inp.length-1]!==seq[inp.length-1])return done({sus:1,out:"Wrong glyph. GI restarts the chant from birth. You are excused, tearfully."});
     if(inp.length===seq.length)return done({syn:5,trustGi:1,out:"Perfect chant. GI salutes so hard a ceiling tile enlists."});
   });
  };show();
 }
};
function runGame(ev){
  MINIGAMES[ev.game](res=>{
    R.syn+=res.syn||0;R.sus+=res.sus||0;R.clr+=res.clr||0;R.doom+=res.doom||0;
    if(res.trustGi)bump("gi",res.trustGi);
    R.log.push(ev.id+":game");
    if(R.log.length%3===0)R.day++;
    $("#stage").innerHTML=`<div class="card"><div class="who ${ev.cls||""}">${CAST[ev.who]||ev.who}</div>
     <div class="out">${res.out}</div>
     <div class="choices"><button class="ch" id="next"><span class="k">⏎</span>Continue the shift</button></div></div>`;
    $("#next").onclick=()=>deal();
    statBar();
  });
}

/* ---------------- engine ---------------- */
const statBar=()=>{
  $("#bar").innerHTML=
   `<span class="stat">DAY <b>${R.day}</b></span>
    <span class="stat">SYNERGY <b>${R.syn}</b></span>
    <span class="stat ${R.sus>=7?"warn":""}">SUSPICION <b>${Math.max(0,R.sus)}</b>/10</span>
    <span class="stat">CLEARANCE <b>${R.clr}</b></span>
    <span class="stat doom">DOOM <b>${R.doom}</b>/12</span>
    <span class="stat">ROLE <b>${R.role}</b></span>`;
  $("#runinfo").textContent=`RUN #${FILE.runs} · SEED ${SEED} · LORE ${FILE.lore.length}/${Object.keys(LORE).length}`;
};
function eligible(){
  return EVENTS.filter(e=>!R.seen.includes(e.id)&&(!e.req||e.req(R)));
}
function deal(){
  if(R.dead)return;
  statBar();
  if(R.sus>=10)return die("EXPOSED","Your humanity was detected at a rate incompatible with employment. Policy §7.12B is enforced with regret and a commemorative mug.");
  if(R.doom>=12)return die("DOOMSDAY","The clock arrived. The show went on without you. Attrition, natural as sunrise.");
  const pool=eligible();
  if(!pool.length){R.day++;R.seen=R.seen.filter(id=>["cert"].includes(id));return deal();}
  const ev=pick(pool);
  R.seen.push(ev.id);
  render(ev);
}
function render(ev){
  const who=CAST[ev.who]||ev.who;
  if(ev.game){
    $("#stage").innerHTML=`<div class="card"><div class="who ${ev.cls||""}">${who}</div><p>${ev.text}</p>
     <div class="choices"><button class="ch" id="begin"><span class="k">▸</span>Begin</button></div></div>`;
    $("#begin").onclick=()=>runGame(ev);
    return;
  }
  $("#stage").innerHTML=`<div class="card"><div class="who ${ev.cls||""}">${who}</div><p>${ev.text}</p><div class="choices">${
    ev.choices.map((c,i)=>`<button class="ch" data-i="${i}"><span class="k">${i+1}</span>${c.t}</button>`).join("")}</div></div>`;
  document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>choose(ev,+b.dataset.i));
}
function choose(ev,i){
  const c=ev.choices[i],fx=c.fx||{};
  R.syn+=fx.syn||0;R.sus+=fx.sus||0;R.clr+=fx.clr||0;R.doom+=fx.doom||0;
  if(c.trust)bump(c.trust[0],c.trust[1]);
  let loreHtml="";
  if(c.lore&&!FILE.lore.includes(c.lore)){FILE.lore.push(c.lore);saveFile();
    const L=LORE[c.lore];loreHtml=`<div class="lorebox">◈ RECOVERED: ${L.t}\n${L.x}</div>`;}
  R.log.push(ev.id+":"+i);
  /* every third event ends the day */
  if(R.log.length%3===0)R.day++;
  const card=$("#stage").firstElementChild;
  card.querySelector(".choices").remove();
  card.insertAdjacentHTML("beforeend",`<div class="out">${c.out}</div>${loreHtml}<div class="choices"><button class="ch" id="next"><span class="k">⏎</span>Continue the shift</button></div>`);
  $("#next").onclick=()=>deal();
  statBar();
}
function die(cause,text){
  R.dead=true;
  FILE.bestDay=Math.max(FILE.bestDay,R.day);FILE.bestSyn=Math.max(FILE.bestSyn,R.syn);
  FILE.deaths[cause]=(FILE.deaths[cause]||0)+1;
  const unlocks=[];
  if(FILE.runs>=2&&!FILE.roles.includes("ARCHIVIST")){FILE.roles.push("ARCHIVIST");unlocks.push("ROLE UNLOCKED: ARCHIVIST (start with clearance)")}
  if(FILE.bestSyn>=25&&!FILE.roles.includes("PROCUREMENT")){FILE.roles.push("PROCUREMENT");unlocks.push("ROLE UNLOCKED: PROCUREMENT (start with synergy)")}
  if((FILE.deaths.EXPOSED||0)>=2&&!FILE.roles.includes("BODY DOUBLE")){FILE.roles.push("BODY DOUBLE");unlocks.push("ROLE UNLOCKED: BODY DOUBLE (suspicion resistant)")}
  saveFile();
  $("#stage").innerHTML=`<div class="card term"><h2>NATURAL ATTRITION · ${cause}</h2>
   <p>${text}</p>
   <p class="meta">Survived to DAY ${R.day} · SYNERGY ${R.syn} · CLEARANCE ${R.clr}<br>
   Lore recovered (permanent): ${FILE.lore.length}/${Object.keys(LORE).length}</p>
   ${unlocks.map(u=>`<div class="lorebox">◈ ${u}</div>`).join("")}
   <div class="choices">${FILE.roles.map(r=>`<button class="ch" data-r="${r}"><span class="k">▸</span>NEW EMPLOYMENT · AS ${r}</button>`).join("")}</div></div>`;
  document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{newRun(b.dataset.r);deal()});
}
$("#resign").onclick=()=>{
  if(!R||R.dead)return;
  R.sus+=2;
  $("#stage").insertAdjacentHTML("afterbegin",`<div class="card"><div class="who sys">SUBLEVEL SYSTEMS</div><p>Resignation declined. Employees may not terminate their employment; employment terminates the employee. This is called natural attrition. Your attempt has been logged as a human behaviour.</p></div>`);
  statBar();
};
$("#dossier").onclick=()=>{
  const known=FILE.lore.map(k=>`<div class="lorebox">◈ ${LORE[k].t}\n${LORE[k].x}</div>`).join("")||`<p class="dim">Nothing recovered yet. Clearance opens drawers.</p>`;
  $("#stage").insertAdjacentHTML("afterbegin",`<div class="card"><div class="who lore">PERSONNEL FILE (PERMANENT)</div>
   <p>Employments: ${FILE.runs} · Best day: ${FILE.bestDay} · Best synergy: ${FILE.bestSyn}</p>
   <p>${FILE.roles.map(r=>`<span class="badge">${r}</span>`).join("")}</p>${known}
   <div class="choices"><button class="ch" id="closed"><span class="k">✕</span>Close the file</button></div></div>`);
  $("#closed").onclick=e=>e.target.closest(".card").remove();
};
addEventListener("keydown",e=>{
  if(e.key==="Enter"&&$("#next"))return $("#next").click();
  const n=+e.key; const btns=document.querySelectorAll("#stage .ch[data-i]");
  if(n>=1&&n<=btns.length)btns[n-1].click();
});
/* boot */
newRun("TRAINEE");deal();
console.log("%cSUBLEVEL B","color:#ff0044","— you found the basement. The folder is filed under W.");
</script>
